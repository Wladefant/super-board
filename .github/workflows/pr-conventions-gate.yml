name: PR Conventions Gate

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventions-gate:
    name: Verify PR Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Consolidated PR Conventions Gate
        run: node .github/scripts/pr-conventions-gate.cjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTIONS: 'true'
          GH_TOKEN: ${{ github.token }}
