name: PR Conventions Gate

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventions-gate:
    name: Verify PR Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Consolidated PR Conventions Gate
        run: node .github/scripts/pr-conventions-gate.cjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTIONS: 'true'
          GH_TOKEN: ${{ github.token }}

      - name: STE writing check (warning only)
        if: always()
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-text.md"
          python3 workflows/portable/ste_check.py check --format md "$RUNNER_TEMP/pr-text.md" | tee "$RUNNER_TEMP/ste.txt"
          score=$(head -n1 "$RUNNER_TEMP/ste.txt")
          echo "::warning title=STE writing score::$score"

      # Done report (Wladefant/super-board#502): failing check; the dry run over the last 30 merged PRs is on the issue.
      - name: Check Deleted and Not run lines
        run: python3 workflows/portable/evidence_lint.py done-report-pr --repo "$GITHUB_REPOSITORY" --number "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
