name = "admin-monitor"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
ADMIN_BASE_URL = "https://admin.pinthread.dev"
