<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0f172a"/>
  
  <!-- Header: [40, 20, 720, 60] -->
  <g id="header">
    <rect x="40" y="20" width="720" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="70" cy="50" r="14" fill="#38bdf8"/>
    <text x="96" y="55" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" font-weight="600">System Monitor</text>
    <rect x="650" y="38" width="90" height="24" rx="12" fill="#065f46"/>
    <text x="695" y="54" fill="#34d399" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Telemetry: [40, 100, 450, 360] -->
  <g id="telemetry">
    <rect x="40" y="100" width="450" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="64" y="136" fill="#f8fafc" font-size="14" font-family="system-ui, sans-serif" font-weight="600">Cluster Throughput</text>
    <text x="64" y="180" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="700">94.2k req/s</text>
    <text x="64" y="202" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Global Traffic</text>
    <text x="260" y="180" fill="#a7f3d0" font-size="28" font-family="system-ui, sans-serif" font-weight="700">12.4 ms</text>
    <text x="260" y="202" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">P99 Latency</text>
    <path d="M 64 300 Q 150 250, 220 280 T 360 240 T 450 260" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="64" y="430" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Last updated: just now</text>
  </g>

  <!-- Quick Actions (After: Swapped to Upper right): [510, 100, 250, 170] -->
  <g id="quick-actions">
    <rect x="510" y="100" width="250" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="530" y="132" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Quick Actions</text>
    <rect x="530" y="150" width="210" height="40" rx="6" fill="#0284c7"/>
    <text x="635" y="175" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Deploy Release</text>
    <rect x="530" y="205" width="210" height="40" rx="6" fill="#334155"/>
    <text x="635" y="230" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Drain Pool</text>
  </g>

  <!-- Node Health (After: Swapped to Lower right): [510, 290, 250, 170] -->
  <g id="node-health">
    <rect x="510" y="290" width="250" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="530" y="322" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Node Health</text>
    <text x="530" y="355" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">8 / 8 active nodes</text>
    <text x="530" y="385" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">RAM 62% · CPU 41%</text>
    <rect x="530" y="410" width="210" height="8" rx="4" fill="#334155"/>
    <rect x="530" y="410" width="130" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Event Log: [40, 480, 720, 90] -->
  <g id="event-log">
    <rect x="40" y="480" width="720" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="64" y="512" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Event Stream</text>
    <text x="64" y="542" fill="#cbd5e1" font-size="12" font-family="monospace">[10:42:01] Route /api/v1/orders healthy · 0 errors</text>
  </g>
</svg>
