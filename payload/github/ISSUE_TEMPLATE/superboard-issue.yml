name: "Superboard task"
description: "Structured task with enforced Context / Steps / Acceptance criteria / classification"
labels: []

body:
  - type: input
    id: title-summary
    attributes:
      label: "Title"
      description: "One-line summary of the task"
    validations:
      required: true

  - type: dropdown
    id: work-type
    attributes:
      label: "Work type"
      description: "Universal work classification. Mirrored as a label by the intake normalizer."
      options:
        - build
        - docs
        - research
        - proof
        - decision
        - risk
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "Why this task exists; background and links"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps"
      description: "Concrete steps to complete the work"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Binary, checkable criteria"
      placeholder: |
        - [ ] Given <state>, When <action>, Then <observable result>
        - [ ] Given ..., When ..., Then ...
    validations:
      required: true

  - type: input
    id: test-area
    attributes:
      label: "Test Area"
      description: "The surface QA exercises for this card, for example runtime, board, installer, frontend. Mirrored as an `area:<value>` label."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "Mirrored as a `priority:<value>` label."
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: environment-constraint
    attributes:
      label: "Environment constraint"
      description: "Canonical taxonomy. `environment-constraint` means the card needs a specific machine or environment and doubles as a dispatch filter. `laptop` is the preserved legacy alias and is mapped onto `environment-constraint`."
      options:
        - none
        - environment-constraint
        - laptop
    validations:
      required: true

  - type: dropdown
    id: branch-route
    attributes:
      label: "Branch route"
      description: "The base branch this card targets. Exactly one value; nothing else routes anything."
      options:
        - staging
        - staging-frankfurt
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: "Milestone"
      description: "The repository milestone this card belongs to. The repository is its only ledger. Leave empty ONLY when the Blocked reason below is filled in."
    validations:
      required: false

  - type: textarea
    id: blocked-reason
    attributes:
      label: "Blocked reason"
      description: "Required when no milestone is set. Name the concrete thing that must happen first. Placeholders such as TBD or n/a are refused."
    validations:
      required: false
